name: Build & Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn test -B

  build-and-push:
    name: 🐳 Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn package -DskipTests -B

      - name: Generate timestamp tag
        id: timestamp
        run: echo "tag=$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: Lowercase repo name
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:${{ steps.timestamp.outputs.tag }}

      # ========== GitOps: 更新 Helm values.yaml 并提交回 Git ==========
      - name: Update Helm values.yaml with new image tag
        run: |
          NEW_TAG="${{ steps.timestamp.outputs.tag }}"
          sed -i 's/^  tag: .*/  tag: '"$NEW_TAG"'/' charts/game2048/values.yaml
          echo "Updated tag to: $(grep '  tag:' charts/game2048/values.yaml)"

      - name: Commit and push values.yaml update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/game2048/values.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update Helm image tag to ${{ steps.timestamp.outputs.tag }} [skip ci]"
            git push
          fi
