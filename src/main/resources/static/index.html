<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #faf8ef; color: #776e65;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  h1 { font-size: 64px; font-weight: 800; margin: 10px 0; }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 500px; margin-bottom: 15px;
  }
  .score-box {
    background: #bbada0; color: #fff;
    padding: 8px 20px; border-radius: 6px; text-align: center; font-weight: 700;
  }
  .score-box .label { font-size: 12px; text-transform: uppercase; }
  .score-box .value { font-size: 24px; }
  .btn-row { display: flex; gap: 8px; }
  .btn {
    background: #8f7a66; color: #f9f6f2; border: none;
    padding: 10px 20px; border-radius: 6px; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: background .15s;
  }
  .btn:hover { background: #9f8b76; }
  .btn:active { transform: scale(0.96); }

  .grid-container {
    position: relative; width: 500px; height: 500px;
    background: #bbada0; border-radius: 8px; padding: 15px;
    display: grid; grid-template: repeat(4,1fr) / repeat(4,1fr);
    gap: 15px; touch-action: none;
  }
  .cell {
    background: rgba(238,228,218,.35); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 800; transition: all .1s;
  }
  .tile-2    { background:#eee4da; color:#776e65; }
  .tile-4    { background:#ede0c8; color:#776e65; }
  .tile-8    { background:#f2b179; color:#f9f6f2; }
  .tile-16   { background:#f59563; color:#f9f6f2; }
  .tile-32   { background:#f67c5f; color:#f9f6f2; }
  .tile-64   { background:#f65e3b; color:#f9f6f2; }
  .tile-128  { background:#edcf72; color:#f9f6f2; font-size:36px; }
  .tile-256  { background:#edcc61; color:#f9f6f2; font-size:36px; }
  .tile-512  { background:#edc850; color:#f9f6f2; font-size:36px; }
  .tile-1024 { background:#edc53f; color:#f9f6f2; font-size:28px; }
  .tile-2048 { background:#edc22e; color:#f9f6f2; font-size:28px; }
  .tile-super { background:#3c3a32; color:#f9f6f2; font-size:24px; }

  .msg-overlay {
    display: none; position: absolute; inset: 0;
    background: rgba(238,228,218,.73);
    border-radius: 8px; z-index: 10;
    flex-direction: column; align-items: center; justify-content: center;
  }
  .msg-overlay.show { display: flex; }
  .msg-overlay h2 { font-size: 48px; margin-bottom: 10px; }
  .msg-overlay .btn { font-size: 18px; padding: 12px 36px; }

  .info-text { margin-top: 15px; color: #776e65; font-size: 14px; text-align: center; }

  @media (max-width:540px) {
    .grid-container { width: 95vw; height: 95vw; padding: 10px; gap: 10px; }
    .cell { font-size: 28px; }
    .tile-128,.tile-256,.tile-512 { font-size: 24px; }
    .tile-1024,.tile-2048 { font-size: 20px; }
    .tile-super { font-size: 18px; }
    h1 { font-size: 40px; }
  }
</style>
</head>
<body>
<h1>2048</h1>
<div class="header">
  <div class="score-box">
    <div class="label">SCORE</div>
    <div class="value" id="score">0</div>
  </div>
  <div class="btn-row">
    <button class="btn" onclick="resetGame()">New Game</button>
  </div>
</div>

<div class="grid-container" id="board">
  <div class="msg-overlay" id="overlay">
    <h2 id="msgTitle"></h2>
    <button class="btn" onclick="resetGame()">Try Again</button>
  </div>
</div>
<div class="info-text">
  方向键 / WASD / 滑动 操作
</div>

<script>
const API = '/api/game';
const SIZE = 4;
const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const overlayEl = document.getElementById('overlay');
const msgTitle = document.getElementById('msgTitle');

let cells = [];

function initBoard() {
  boardEl.querySelectorAll('.cell').forEach(el => el.remove());
  cells = [];
  for (let r = 0; r < SIZE; r++) {
    cells[r] = [];
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r; cell.dataset.c = c;
      boardEl.appendChild(cell);
      cells[r][c] = cell;
    }
  }
  overlayEl.classList.remove('show');
}

function tileClass(val) {
  if (val === 0) return '';
  if (val <= 2048) return 'tile-' + val;
  return 'tile-super';
}

function render(state) {
  const grid = state.grid;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const el = cells[r][c];
      const val = grid[r][c];
      el.className = 'cell';
      if (val > 0) {
        el.classList.add(tileClass(val));
        el.textContent = val;
      } else {
        el.textContent = '';
      }
    }
  }
  scoreEl.textContent = state.score;
  overlayEl.classList.remove('show');
  if (state.won) {
    msgTitle.textContent = '🎉 You Win!';
    overlayEl.classList.add('show');
  } else if (state.gameOver) {
    msgTitle.textContent = '😵 Game Over!';
    overlayEl.classList.add('show');
  }
}

function fetchState() {
  fetch(API + '/state')
    .then(r => r.json())
    .then(render)
    .catch(console.error);
}

function resetGame() {
  fetch(API + '/reset', {method:'POST'})
    .then(r => r.json())
    .then(render)
    .catch(console.error);
}

function sendMove(dir) {
  fetch(API + '/move?dir=' + dir, {method:'POST'})
    .then(r => r.json())
    .then(render)
    .catch(console.error);
}

/* --- keyboard --- */
document.addEventListener('keydown', e => {
  const map = {
    ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
    w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right'
  };
  const dir = map[e.key];
  if (dir) { e.preventDefault(); sendMove(dir); }
});

/* --- touch (swipe) --- */
let tx=0, ty=0;
boardEl.addEventListener('touchstart', e => {
  const t = e.touches[0];
  tx = t.clientX; ty = t.clientY;
});
boardEl.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const dx = t.clientX - tx, dy = t.clientY - ty;
  const absX = Math.abs(dx), absY = Math.abs(dy);
  if (Math.max(absX, absY) < 30) return;
  sendMove(absX > absY ? (dx>0 ? 'right' : 'left') : (dy>0 ? 'down' : 'up'));
});

/* --- start --- */
initBoard();
fetchState();
</script>
</body>
</html>
